name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * 6'

permissions:
  contents: read

jobs:
  availability:
    name: Check CodeQL availability
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PRIVATE_CODEQL_ENABLED: ${{ vars.ENABLE_PRIVATE_CODEQL }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ] || [ "$PRIVATE_CODEQL_ENABLED" = "true" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### CodeQL indisponível neste repositório privado' >> "$GITHUB_STEP_SUMMARY"
            echo 'A análise não foi executada. É necessário GitHub Code Security habilitado; depois configure ENABLE_PRIVATE_CODEQL=true. Os testes e validações do workflow Validação Movement continuam ativos.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # O extrator sem build reconhece .cpp, mas não sketches Arduino .ino.
      # A cópia é temporária no runner e contém o firmware real, sem stubs.
      - name: Prepare Arduino sources for C++ extraction
        if: matrix.language == 'c-cpp'
        shell: python
        run: |
          from pathlib import Path

          sketches = sorted(Path("firmware").rglob("*.ino"))
          if not sketches:
              raise SystemExit("Nenhum sketch Arduino encontrado para análise.")
          for sketch in sketches:
              target = sketch.with_suffix(".ino.cpp")
              if target.exists():
                  raise SystemExit(f"Arquivo já existe: {target}")
              target.write_text(
                  '#include <Arduino.h>\n' + sketch.read_text(encoding="utf-8"),
                  encoding="utf-8",
              )
              print(f"Preparado para análise: {target}")

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
